networks:
  nocobase:
    driver: bridge

services:
  # ---------------- Backend ----------------
  backend:
    image: nocobase/nocobase:latest-full
    container_name: nocobase_backend
    restart: always
    networks:
      - nocobase
    depends_on:
      - postgres
    env_file:
      - .env
    volumes:
      - ./NocoBaseBackEnd/storage:/app/nocobase/storage
    ports:
      - "13000:80"

  # ---------------- PostgreSQL ----------------
  postgres:
    image: postgres:16
    container_name: nocobase_postgres
    restart: always
    command: postgres -c wal_level=logical
    env_file:
      - .env
    volumes:
      - ./NocoBaseBackEnd/storage/db/postgres:/var/lib/postgresql/data
    networks:
      - nocobase
    ports:
      - "5432:5432"

  # ---------------- pgAdmin ----------------
  pgadmin:
    image: dpage/pgadmin4:7
    container_name: nocobase_pgadmin
    restart: always
    env_file:
      - .env
    networks:
      - nocobase
    depends_on:
      - postgres
    volumes:
      - ./NocoBaseBackEnd/storage/pgadmin:/var/lib/pgadmin
    ports:
      - "8080:80"

  # ---------------- Realtime Server ----------------
  realtime:
    build:
      context: ./NocoBaseRealTimeServer
      dockerfile: Dockerfile
    container_name: nocobase_realtime
    restart: always
    networks:
      - nocobase
    ports:
      - "3001:3000"
    depends_on:
      - backend

  # ---------------- Frontend (PHP) ----------------
  frontend:
    image: php:8.2-apache
    container_name: nocobase_frontend
    restart: always
    networks:
      - nocobase
    volumes:
      - ./NocoBaseFrontEnd:/var/www/html
    ports:
      - "8081:80"
